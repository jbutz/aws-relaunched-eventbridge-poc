name: Tests

on:
  push: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run --if-present lint
      - name: Run build
        run: npm run --if-present build
      - name: Run tests
        run: npm test
